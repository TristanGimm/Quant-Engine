services:
  engine:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      BIND_HOST: 0.0.0.0
      PORT: '8080'
      TOKEN_FILE: /app/data/tokens.json
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    volumes:
      - tokens:/app/data
    expose:
      - '8080'
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [engine]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  tokens:
  caddy_data:
  caddy_config:
